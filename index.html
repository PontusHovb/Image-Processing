<!DOCTYPE html>
<html>
<head>
    <title>Image Processing</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1 class="title" align="center">Image Processing</h1>

    <div class="content">
        <i>Project in JavaScript testing different functions and algorithms to alter images</i>
    </div>

    <div class="content">
        <input type="file" id="imageInput">
        <canvas id="imagePreview">Image failed to load.</canvas>
    </div>

    <div class="content">
        <div class="button-container">
            <label for="zoomSlider">Zoom: </label>
            <input type="range" id="zoomSlider" min="1" max="3" step="0.1" value="1">
        </div>
        
        <!-- Process image -->
        <div class="button-container">
            Process image:
            <button id="convoluteImage">Blur</button>
            <button id="grayscaleImage">Gray</button>
            <button id="mirrorImage">Mirror</button>
            <!-- TODO: Flip image -->
        </div>
        
        <!-- Modify image -->
        <div class="button-container">
            Modify image:
            <button id="unConvoluteImage">Sharpen</button>
            <!-- TODO: Remove background -->
        </div>

        <!-- Uploaded image -->
        <div class="button-container">
            Uploaded image:
            <button id="saveImage">Save image</button>
            <button id="removeImage">Remove image</button>
            <button id="resetImage">Reset modifications</button>
        </div>
    </div>
    
    <p align="right">Pontus Hovberger, 2024</p>

    <!-- Scripts -->
    <script src="JavaScript/image.js"></script>
    <script src="JavaScript/convolution.js"></script>
    <script src="JavaScript/grayscale.js"></script>
    <script src="JavaScript/mirror.js"></script>
    <script src="JavaScript/zoom.js"></script>
</body>
</html>
